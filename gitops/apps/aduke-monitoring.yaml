apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aduke-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/GreatOmotayo/azure-aks-observability-platform"
    targetRevision: main 
    path: charts/aduke-monitoring
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true 