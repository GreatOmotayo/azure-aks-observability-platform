name: Application Insights Infra

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]
        paths:
          - "terraform/core/**.tf"
          - ".github/workflows/terraform.yml"

    push:
        branches: [ main ]
        paths:
          - "terraform/core/**.tf"
          - ".github/workflows/terraform.yml"

permissions:
    id-token: write
    contents: read
    pull-requests: write

env:
    ARM_CLIENT_ID:                      ${{ secrets.AZURE_CLIENT_ID }}
    ARM_TENANT_ID:                      ${{ secrets.AZURE_TENANT_ID }}
    ARM_SUBSCRIPTION_ID:                ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    ARM_USE_OIDC:                       true
    TF_VAR_subscription_id:             ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    TF_VAR_grafana_admin_password:      ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

defaults:
    run:
        working-directory: terraform/core

jobs:
    plan:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.9.0"

            - name: Azure login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

            - name: Terraform fmt check
              run: terraform fmt -check -recursive

            - name: Terraform Init
              run: terraform init

            - name: Terraform Plan
              id:  plan
              run: terraform plan -out=tfplan
              continue-on-error: true

            - name: Comment Plan to PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const output = `#### Terraform Plan 
                      \`\`\`
                      ${{ steps.plan.outputs.stdout }}
                      \`\`\``;
                      github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: output
                      });
            
            - name: Fail job if plan failed
              if: steps.plan.outcome == 'failure'
              run: exit 1

    apply:
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment: production
        permissions:
          id-token: write
          contents: write
          pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.9.0"

            - name: Azure login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: terraform init

            - name: Terraform Apply
              run: terraform apply -auto-approve

            - name: Populate values.yaml from terraform output
              working-directory: .
              run: ./scripts/populate-values.sh

            - name: Open PR with populated values
              uses: peter-evans/create-pull-request@v8
              with:
                commit-message: "chore: populate values.yaml from terraform output"
                title: "chore: populate values.yaml from terraform output"
                body: |
                  Automated placeholder population, run immediately after a
                  successful `terraform apply`.

                  Requires review and merge before ArgoCD picks this up - this
                  PR does not auto-merge.
                branch: "populate-values-${{ github.sha }}"
                base: main
                delete-branch: true
